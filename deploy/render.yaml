services:
  # Backend API
  - type: web
    name: urbanpulse-api
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: CORS_ORIGIN
        value: "*"
      - key: PRIVACY_K
        value: "5"
      - key: PRIVACY_POP_FLOOR
        value: "500"

  # Frontend Static Site
  - type: web
    name: urbanpulse-frontend
    env: static
    region: singapore
    plan: free
    buildCommand: "cd web && npm install && npm run build"
    staticPublishPath: ./web/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://urbanpulse-api.onrender.com/api/*
      - type: rewrite
        source: /sse/*
        destination: https://urbanpulse-api.onrender.com/sse/*
